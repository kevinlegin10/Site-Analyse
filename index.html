<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Data Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col hidden md:flex">
      <div class="p-5 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-500/30">
            <i data-lucide="database" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-white">DataForge</h1>
            <p class="text-xs text-slate-400">Fleet Control Panel</p>
          </div>
        </div>
      </div>

      <div class="p-4 border-b border-slate-800">
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Profile</label>
          <button onclick="createNewProfile()" class="text-indigo-400 hover:text-indigo-300 text-xs font-bold flex items-center gap-1 transition-colors">
            <i data-lucide="plus" class="w-3 h-3"></i> New
          </button>
        </div>
        <select id="profileSelect" onchange="switchProfile()" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-indigo-500 p-2 outline-none">
          <option value="default">default</option>
        </select>
      </div>

      <div class="p-4 flex-1 overflow-y-auto">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Database Tables</label>
        <ul id="sidebarNav" class="space-y-1">
          <li class="text-slate-500 text-sm italic px-2">Loading tables...</li>
        </ul>
      </div>

      <div class="p-4 border-t border-slate-800 bg-slate-900/50">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Schema Builder</label>
        <button onclick="openTableBuilderModal()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2.5 rounded-lg text-sm font-medium transition-all shadow-sm">
          <i data-lucide="table-properties" class="w-4 h-4"></i> Construct New Table
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
      <header class="bg-slate-950 border-b border-slate-800 p-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4 z-10">
        <div class="relative w-full sm:w-96">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Search active table..." class="w-full bg-slate-900 border border-slate-700 text-sm text-white rounded-lg pl-10 pr-4 py-2.5 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
          <div class="relative group">
            <button class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-lg border border-slate-700 text-sm font-medium transition-all">
              <i data-lucide="columns" class="w-4 h-4"></i> Columns
            </button>
            <div class="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-700 rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 p-2 max-h-64 overflow-y-auto" id="columnToggleContainer">
              <p class="text-xs text-slate-400 italic px-2 py-1">Select a table first</p>
            </div>
          </div>

          <button onclick="openAddRecordModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-lg text-sm font-medium shadow-lg shadow-indigo-600/20 transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i> Assign / Add
          </button>
        </div>
      </header>

      <div class="flex-1 overflow-auto p-6 bg-slate-900/50">
        <div id="tableStatusHeader" class="mb-4 flex items-center justify-between">
          <h2 id="currentTableName" class="text-xl font-bold text-white">No Table Selected</h2>
          <span id="recordCount" class="text-sm text-slate-400"></span>
        </div>
        
        <div id="tableLoader" class="hidden flex-col items-center justify-center py-20">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500 mb-4"></div>
          <p class="text-sm text-slate-400">Querying records...</p>
        </div>

        <div id="tableContainer" class="bg-slate-950 border border-slate-800 rounded-xl shadow-sm overflow-hidden hidden">
          </div>
      </div>
    </main>

    <div id="addRecordModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
      <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-xl shadow-2xl p-6 relative">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
          <h3 class="text-lg font-bold text-white" id="modalTitle">Add Record</h3>
          <button onclick="closeModal('addRecordModal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form id="addRecordForm" onsubmit="submitNewRecord(event)" class="space-y-4">
          <div id="dynamicFormFields" class="space-y-3 max-h-96 overflow-y-auto pr-2">
            </div>
          <div class="flex gap-3 justify-end pt-4 border-t border-slate-800">
            <button type="button" onclick="closeModal('addRecordModal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-medium">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium">Save Record</button>
          </div>
        </form>
      </div>
    </div>

    <div id="tableBuilderModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
      <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-xl shadow-2xl p-6 relative flex flex-col max-h-[90vh]">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4 shrink-0">
          <div>
            <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="table-properties" class="w-5 h-5 text-indigo-400"></i> Construct Custom Table</h3>
            <p class="text-xs text-slate-400 mt-1">Select columns from existing tables to build a new view schema.</p>
          </div>
          <button onclick="closeModal('tableBuilderModal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="space-y-4 overflow-y-auto pr-2 flex-1">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">New Table Name</label>
            <input type="text" id="newSchemaName" required placeholder="e.g., Unified Analytics, Driver Trucks" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none">
          </div>
          
          <div class="bg-slate-950 border border-slate-800 rounded-lg p-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-3">Available Columns</label>
            <div id="builderColumnArea" class="space-y-4">
              </div>
          </div>
        </div>

        <div class="flex gap-3 justify-end pt-4 border-t border-slate-800 mt-4 shrink-0">
          <button type="button" onclick="closeModal('tableBuilderModal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-medium">Cancel</button>
          <button onclick="submitNewTableSchema()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium shadow-lg shadow-indigo-600/20">Generate Table</button>
        </div>
      </div>
    </div>

    <script>
      let currentProfile = 'default';
      let activeDatabaseStructure = {};
      let activeTable = null;
      let hiddenColumns = {};

      document.addEventListener("DOMContentLoaded", () => {
        initializeIcons();
        fetchAvailableProfiles();
        loadActiveProfileRecords();
      });

      function initializeIcons() { if (window.lucide) window.lucide.createIcons(); }

      async function fetchAvailableProfiles() {
        try {
          const res = await fetch('/api/profiles');
          const data = await res.json();
          const selector = document.getElementById('profileSelect');
          selector.innerHTML = '';
          data.profiles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p; opt.textContent = p;
            if(p === currentProfile) opt.selected = true;
            selector.appendChild(opt);
          });
        } catch(e) { console.error("Profiles failed", e); }
      }

      // NEW: Create a brand new database profile instantly
      function createNewProfile() {
        const name = prompt("Enter a name for the new Database Profile:");
        if (name && name.trim()) {
          currentProfile = name.trim();
          activeDatabaseStructure = {};
          activeTable = null;
          
          const sel = document.getElementById('profileSelect');
          if (![...sel.options].some(o => o.value === currentProfile)) {
            const opt = document.createElement('option');
            opt.value = currentProfile; opt.textContent = currentProfile;
            sel.appendChild(opt);
          }
          sel.value = currentProfile;
          
          renderSidebar();
          renderTable();
        }
      }

      async function loadActiveProfileRecords() {
        document.getElementById('tableLoader').style.display = 'flex';
        document.getElementById('tableContainer').classList.add('hidden');
        try {
          const res = await fetch(`/api/data?profile=${currentProfile}`);
          activeDatabaseStructure = await res.json();
          
          document.getElementById('tableLoader').style.display = 'none';
          renderSidebar();
          
          const tables = Object.keys(activeDatabaseStructure);
          if(tables.length > 0 && !activeTable) selectTable(tables[0]);
          else if (activeTable) renderTable();

        } catch (err) { alert("Failed to fetch database records."); }
      }

      function switchProfile() {
        currentProfile = document.getElementById('profileSelect').value;
        activeTable = null; 
        loadActiveProfileRecords();
      }

      function renderSidebar() {
        const nav = document.getElementById('sidebarNav');
        nav.innerHTML = '';
        const tables = Object.keys(activeDatabaseStructure);
        
        if (tables.length === 0) {
          nav.innerHTML = '<li class="text-slate-500 text-xs px-2">No tables found. Create one!</li>';
          return;
        }

        tables.forEach(tableName => {
          const li = document.createElement('li');
          const isActive = activeTable === tableName;
          li.className = `cursor-pointer px-3 py-2 rounded-lg text-sm font-medium transition-colors flex justify-between items-center ${isActive ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`;
          li.onclick = () => selectTable(tableName);
          li.innerHTML = `
            <div class="flex items-center gap-2">
              <i data-lucide="${getIconForTable(tableName)}" class="w-4 h-4"></i>
              ${tableName}
            </div>
            <span class="${isActive ? 'bg-indigo-500 text-indigo-50' : 'bg-slate-800 text-slate-500'} text-xs py-0.5 px-2 rounded-full">${activeDatabaseStructure[tableName].length}</span>
          `;
          nav.appendChild(li);
        });
        initializeIcons();
      }

      function getIconForTable(name) {
        const n = name.toLowerCase();
        if(n.includes('truck') || n.includes('vehicle')) return 'truck';
        if(n.includes('driver') || n.includes('user')) return 'users';
        if(n.includes('assign')) return 'clipboard-list';
        if(n.includes('trailer')) return 'layout-template';
        return 'table-2';
      }

      function selectTable(tableName) {
        activeTable = tableName;
        document.getElementById('currentTableName').textContent = tableName;
        renderSidebar(); 
        renderColumnPicker();
        renderTable();
      }

      function renderColumnPicker() {
        const container = document.getElementById('columnToggleContainer');
        container.innerHTML = '';
        if(!activeTable || !activeDatabaseStructure[activeTable] || activeDatabaseStructure[activeTable].length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-400 px-2 py-1">No columns</p>';
          return;
        }

        const headers = Object.keys(activeDatabaseStructure[activeTable][0]);
        if(!hiddenColumns[activeTable]) hiddenColumns[activeTable] = [];

        headers.forEach(header => {
          const isHidden = hiddenColumns[activeTable].includes(header);
          container.innerHTML += `
            <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-slate-800 rounded cursor-pointer text-sm text-slate-300">
              <input type="checkbox" onchange="toggleColumn('${header}')" ${!isHidden ? 'checked' : ''} class="rounded border-slate-700 bg-slate-900 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900">
              ${header}
            </label>
          `;
        });
      }

      function toggleColumn(header) {
        if(!hiddenColumns[activeTable]) hiddenColumns[activeTable] = [];
        const index = hiddenColumns[activeTable].indexOf(header);
        if (index > -1) hiddenColumns[activeTable].splice(index, 1); 
        else hiddenColumns[activeTable].push(header); 
        renderTable();
      }

      function renderTable() {
        const container = document.getElementById('tableContainer');
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        if (!activeTable) { container.classList.add('hidden'); document.getElementById('recordCount').textContent = ""; return; }
        
        const tableRows = activeDatabaseStructure[activeTable] || [];
        container.classList.remove('hidden');

        if(tableRows.length === 0) {
          container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">No data in ${activeTable}</div>`;
          document.getElementById('recordCount').textContent = "0 Records";
          return;
        }

        const allHeaders = Object.keys(tableRows[0]);
        const visibleHeaders = allHeaders.filter(h => !(hiddenColumns[activeTable] || []).includes(h));

        const filteredRows = tableRows.map((row, idx) => ({ row, idx })).filter(({ row }) => {
          if (!query) return true;
          return visibleHeaders.some(h => String(row[h] || '').toLowerCase().includes(query));
        });

        document.getElementById('recordCount').textContent = `${filteredRows.length} Records`;

        let tableHtml = `
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300 whitespace-nowrap">
              <thead class="bg-slate-900/40 border-b border-slate-800 text-xs uppercase text-slate-400">
                <tr>
                  ${visibleHeaders.map(h => `<th class="px-6 py-4 font-semibold">${h}</th>`).join('')}
                  <th class="px-6 py-4 text-right font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
        `;

        filteredRows.forEach(({ row, idx }) => {
          tableHtml += `<tr class="hover:bg-slate-900/30 transition-colors">`;
          visibleHeaders.forEach(header => {
            const value = row[header] !== undefined && row[header] !== null ? row[header] : '';
            tableHtml += `
              <td class="px-6 py-2.5">
                <input type="text" value="${escapeHtml(String(value))}" 
                  onchange="updateCellInline('${activeTable}', ${idx}, '${header}', this.value)"
                  class="bg-transparent border-b border-transparent hover:border-slate-700 focus:border-indigo-500 focus:bg-slate-900 px-2 py-1 rounded outline-none w-full transition-all text-slate-200 focus:text-white" />
              </td>`;
          });
          tableHtml += `
            <td class="px-6 py-2.5 text-right">
              <button onclick="deleteRowContext('${activeTable}', ${idx})" class="text-slate-500 hover:text-rose-400 p-1.5 rounded bg-slate-800/50 hover:bg-slate-800 transition-colors inline-flex items-center">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>`;
        });

        tableHtml += `</tbody></table></div>`;
        container.innerHTML = tableHtml;
        initializeIcons();
      }

      async function updateCellInline(table, index, field, value) {
        await fetch('/api/update-cell', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile: currentProfile, table, index, field, value })
        });
        activeDatabaseStructure[table][index][field] = value; 
      }

      async function deleteRowContext(table, index) {
        if(!confirm(`Delete record from ${table}?`)) return;
        const res = await fetch('/api/delete-row', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile: currentProfile, table, index })
        });
        if(res.ok) {
          activeDatabaseStructure[table].splice(index, 1);
          renderSidebar();
          renderTable();
        }
      }

      // ADD RECORD LOGIC
      function openAddRecordModal() {
        if(!activeTable) return alert("Select a table from the sidebar first.");
        document.getElementById('modalTitle').textContent = `Add to ${activeTable}`;
        
        const formContainer = document.getElementById('dynamicFormFields');
        formContainer.innerHTML = '';
        
        const headers = Object.keys(activeDatabaseStructure[activeTable][0] || {});
        headers.forEach(header => {
          formContainer.innerHTML += `
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">${header}</label>
              <input type="text" id="addInput_${header}" placeholder="Enter ${header}" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none focus:border-indigo-500">
            </div>
          `;
        });
        
        openModal('addRecordModal');
      }

      async function submitNewRecord(e) {
        e.preventDefault();
        const headers = Object.keys(activeDatabaseStructure[activeTable][0] || {});
        const rowData = {};
        
        headers.forEach(header => {
          rowData[header] = document.getElementById(`addInput_${header}`).value;
        });

        const res = await fetch('/api/add-row', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile: currentProfile, table: activeTable, rowData })
        });

        if(res.ok) {
          if(!activeDatabaseStructure[activeTable]) activeDatabaseStructure[activeTable] = [];
          activeDatabaseStructure[activeTable].unshift(rowData);
          closeModal('addRecordModal');
          renderSidebar();
          renderTable();
        }
      }

      // NEW: CUSTOM SCHEMA BUILDER LOGIC
      function openTableBuilderModal() {
        const area = document.getElementById('builderColumnArea');
        area.innerHTML = '';
        const tables = Object.keys(activeDatabaseStructure);

        if (tables.length === 0) {
          area.innerHTML = '<p class="text-sm text-slate-400 italic">No existing tables to draw columns from. Add data first.</p>';
        } else {
          tables.forEach(tableName => {
            const headers = Object.keys(activeDatabaseStructure[tableName][0] || {});
            if (headers.length > 0) {
              let html = `
                <div class="mb-4">
                  <h4 class="text-sm font-semibold text-slate-300 mb-2 border-b border-slate-800 pb-1 flex items-center gap-2">
                    <i data-lucide="${getIconForTable(tableName)}" class="w-4 h-4 text-slate-500"></i> ${tableName}
                  </h4>
                  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
              `;
              headers.forEach(header => {
                html += `
                  <label class="flex items-center gap-2 text-sm text-slate-400 hover:text-slate-200 cursor-pointer p-1.5 hover:bg-slate-900 rounded transition-colors">
                    <input type="checkbox" value="${header}" class="builder-col-checkbox rounded border-slate-700 bg-slate-950 text-indigo-500 focus:ring-indigo-500">
                    <span class="truncate">${header}</span>
                  </label>
                `;
              });
              html += `</div></div>`;
              area.innerHTML += html;
            }
          });
        }
        initializeIcons();
        openModal('tableBuilderModal');
      }

      async function submitNewTableSchema() {
        const name = document.getElementById('newSchemaName').value.trim();
        if (!name) return alert("Please enter a name for the new table.");

        const checkboxes = document.querySelectorAll('.builder-col-checkbox:checked');
        const selectedCols = Array.from(checkboxes).map(cb => cb.value);
        
        const uniqueCols = [...new Set(selectedCols)]; // Remove duplicates if same column name exists in multiple tables
        if (uniqueCols.length === 0) return alert("Please select at least one column.");

        // Create an empty
