<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPortal Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* ═══════════════════════════════════════════════════════
           TOKENS & THEMES
        ═══════════════════════════════════════════════════════ */
        :root {
            --accent: #00e5a0;
            --accent-dim: #00b87d;
            --accent-glow: rgba(0,229,160,0.18);
            --danger: #ff4d6d;
            --warn: #f59e0b;

            /* dark */
            --bg: #0d0f14;
            --bg2: #13161e;
            --bg3: #1a1e28;
            --bg4: #222636;
            --border: rgba(255,255,255,0.07);
            --border-strong: rgba(255,255,255,0.14);
            --text: #e8eaf2;
            --text-dim: #7a8099;
            --text-muted: #444b60;
            --sidebar-w: 240px;
        }
        [data-theme="light"] {
            --bg: #f0f2f8;
            --bg2: #ffffff;
            --bg3: #f5f7fc;
            --bg4: #eaedf5;
            --border: rgba(0,0,0,0.07);
            --border-strong: rgba(0,0,0,0.14);
            --text: #1a1d2e;
            --text-dim: #5a637a;
            --text-muted: #b0b8cc;
        }

        /* ═══════════════════════════════════════════════════════
           RESET & BASE
        ═══════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ═══════════════════════════════════════════════════════
           TOP BAR
        ═══════════════════════════════════════════════════════ */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 52px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px;
            z-index: 50;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .topbar-brand .logo-icon {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 7px;
            display: grid; place-items: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .topbar-brand span { color: var(--text); }
        .topbar-brand em { color: var(--accent); font-style: normal; }

        .topbar-center {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 460px;
            margin: 0 auto;
        }
        #globalSearch {
            width: 100%;
            padding: 7px 14px 7px 36px;
            background: var(--bg3);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }
        #globalSearch:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .global-search-wrap {
            position: relative;
            flex: 1;
        }
        .global-search-wrap svg {
            position: absolute;
            left: 10px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .topbar-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 13px;
            border-radius: 7px;
            border: 1px solid var(--border-strong);
            background: var(--bg3);
            color: var(--text-dim);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .topbar-btn:hover { background: var(--bg4); color: var(--text); border-color: var(--accent); }
        .topbar-btn.accent { background: var(--accent); color: #000; border-color: var(--accent); }
        .topbar-btn.accent:hover { background: var(--accent-dim); }
        .topbar-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

        #themeToggle {
            width: 32px; height: 32px;
            border-radius: 7px;
            border: 1px solid var(--border-strong);
            background: var(--bg3);
            color: var(--text-dim);
            cursor: pointer;
            display: grid; place-items: center;
            font-size: 15px;
            transition: all 0.15s;
        }
        #themeToggle:hover { background: var(--bg4); color: var(--text); }

        #statusDot {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            padding: 5px 10px;
            border-radius: 6px;
            background: var(--bg3);
            border: 1px solid var(--border);
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--warn);
            animation: pulse 1.5s infinite;
        }
        .dot.online { background: var(--accent); animation: none; }
        .dot.offline { background: var(--danger); animation: none; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

        /* ═══════════════════════════════════════════════════════
           BODY LAYOUT
        ═══════════════════════════════════════════════════════ */
        #shell {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════════════════════ */
        #sidebar {
            width: var(--sidebar-w);
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .sidebar-section { padding: 14px 14px 10px; }
        .sidebar-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 4px;
        }

        /* profile selector */
        .profile-box {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
        }
        .profile-row { display: flex; gap: 6px; margin-bottom: 8px; }
        #profileSelector {
            flex: 1;
            background: var(--bg4);
            border: 1px solid var(--border-strong);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            padding: 6px 8px;
            border-radius: 7px;
            outline: none;
            cursor: pointer;
        }
        .icon-btn {
            width: 30px; height: 30px;
            background: var(--accent);
            border: none;
            border-radius: 7px;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: grid; place-items: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--accent-dim); }

        .upload-btn-sidebar {
            width: 100%;
            background: var(--bg4);
            border: 1px dashed var(--border-strong);
            color: var(--text-dim);
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex; align-items: center; gap: 6px; justify-content: center;
        }
        .upload-btn-sidebar:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }

        /* nav items */
        #navList { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
        .nav-item {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
            position: relative;
        }
        .nav-item:hover { background: var(--bg3); color: var(--text); }
        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(0,229,160,0.2);
        }
        .nav-item .nav-icon { font-size: 14px; flex-shrink: 0; }
        .nav-item .nav-count {
            margin-left: auto;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg4);
            padding: 2px 6px;
            border-radius: 99px;
            color: var(--text-muted);
        }
        .nav-item.active .nav-count {
            background: rgba(0,229,160,0.15);
            color: var(--accent);
        }

        .sidebar-footer {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
        }
        .export-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            color: #000;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 800;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: background 0.15s;
        }
        .export-btn:hover { background: var(--accent-dim); }

        /* ═══════════════════════════════════════════════════════
           MAIN WORKSPACE
        ═══════════════════════════════════════════════════════ */
        #workspace {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-muted);
        }
        .empty-state .big-icon { font-size: 56px; opacity: 0.4; }
        .empty-state h2 { font-size: 20px; font-weight: 700; color: var(--text-dim); }
        .empty-state p { font-size: 13px; }

        /* Page wrapper */
        .page { display: none; flex-direction: column; height: 100%; }
        .page.active { display: flex; }

        /* Page header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }
        .page-title-group { display: flex; align-items: center; gap: 10px; }
        .page-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .page-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg3);
            border: 1px solid var(--border-strong);
            color: var(--text-muted);
            padding: 3px 9px;
            border-radius: 99px;
        }
        .page-actions { display: flex; gap: 8px; align-items: center; }

        /* Search & filter bar */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 200px;
        }
        .search-wrap svg {
            position: absolute;
            left: 10px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .table-search {
            width: 100%;
            padding: 8px 12px 8px 34px;
            background: var(--bg3);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .table-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .col-filter {
            padding: 8px 10px;
            background: var(--bg3);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            min-width: 130px;
        }
        .col-filter:focus { border-color: var(--accent); }

        .filter-pill {
            display: flex; align-items: center; gap: 5px;
            background: var(--accent-glow);
            border: 1px solid rgba(0,229,160,0.25);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px 4px 10px;
            border-radius: 99px;
            white-space: nowrap;
        }
        .filter-pill button {
            background: none; border: none; color: var(--accent);
            cursor: pointer; font-size: 13px; line-height: 1;
            display: grid; place-items: center;
        }

        .result-count {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Add row panel */
        .add-row-panel {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: none;
            flex-shrink: 0;
        }
        .add-row-panel.open { display: block; }
        .add-row-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-end;
        }
        .add-row-field { flex: 1; min-width: 120px; }
        .add-row-field label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .add-row-input {
            width: 100%;
            padding: 7px 10px;
            background: var(--bg3);
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .add-row-input:focus { border-color: var(--accent); }
        .add-row-actions { display: flex; gap: 6px; align-self: flex-end; }

        .btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 14px;
            border-radius: 7px;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-accent:hover { background: var(--accent-dim); }
        .btn-ghost { background: var(--bg3); border-color: var(--border-strong); color: var(--text-dim); }
        .btn-ghost:hover { background: var(--bg4); color: var(--text); }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(255,77,109,0.1); }

        /* Table */
        .table-wrap {
            flex: 1;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            position: sticky;
            top: 0;
            background: var(--bg2);
            border-bottom: 1px solid var(--border-strong);
            padding: 10px 16px;
            text-align: left;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            white-space: nowrap;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }
        thead th:hover { color: var(--text); }
        thead th.sort-asc::after { content: ' ↑'; color: var(--accent); }
        thead th.sort-desc::after { content: ' ↓'; color: var(--accent); }
        thead th.no-sort { cursor: default; }
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }
        tbody tr:hover { background: var(--bg2); }
        tbody tr:last-child { border-bottom: none; }
        td {
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text);
            vertical-align: middle;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        td.interactive-cell {
            cursor: pointer;
            transition: color 0.1s;
        }
        td.interactive-cell:hover { color: var(--accent); }
        td .cell-val { pointer-events: none; }

        /* Inline edit */
        .inline-select, .inline-input {
            width: 100%;
            min-width: 130px;
            padding: 4px 8px;
            background: var(--bg);
            border: 2px solid var(--accent);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            outline: none;
        }
        .inline-select option { background: var(--bg2); }

        /* Row actions */
        .row-actions { display: flex; gap: 6px; }
        .row-del-btn {
            background: none; border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.15s;
            padding: 3px 6px;
            border-radius: 5px;
        }
        .row-del-btn:hover { color: var(--danger); background: rgba(255,77,109,0.1); }

        /* No results */
        .no-results {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }
        .no-results p { font-size: 13px; margin-top: 6px; }

        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 999;
        }
        .toast {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg2);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            animation: slideIn 0.25s ease;
            max-width: 320px;
        }
        .toast.success { border-color: var(--accent); }
        .toast.error { border-color: var(--danger); }
        .toast.warn { border-color: var(--warn); }
        @keyframes slideIn { from { transform: translateX(40px); opacity:0; } to { transform: none; opacity:1; } }
        @keyframes slideOut { to { transform: translateX(40px); opacity:0; } }

        /* Modal */
        #modal-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            place-items: center;
        }
        #modal-backdrop.open { display: grid; }
        #modal-box {
            background: var(--bg2);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            padding: 28px 28px 24px;
            min-width: 340px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        #modal-box h3 { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
        #modal-box p { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
        #modal-input {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg3);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        #modal-input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

        /* Highlight match */
        mark {
            background: rgba(0,229,160,0.28);
            color: var(--accent);
            border-radius: 3px;
            padding: 0 2px;
        }

        /* Responsive: collapse sidebar on small screens */
        @media (max-width: 600px) {
            :root { --sidebar-w: 0px; }
            #sidebar { display: none; }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
    <div class="topbar-brand">
        <div class="logo-icon">⚡</div>
        <span>Data<em>Portal</em></span>
    </div>

    <div class="topbar-center">
        <div class="global-search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="globalSearch" placeholder="Global search across all tables…" oninput="globalSearchHandler(this.value)">
        </div>
    </div>

    <div class="topbar-right">
        <div id="statusDot"><span class="dot" id="dotBullet"></span><span id="statusLabel">Connecting</span></div>
        <button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    </div>
</div>

<!-- SHELL -->
<div id="shell">

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-label">Profile</div>
            <div class="profile-box">
                <div class="profile-row">
                    <select id="profileSelector" onchange="switchProfile(this.value)"></select>
                    <button class="icon-btn" onclick="createProfileModal()" title="New profile">+</button>
                </div>
                <input type="file" id="excelUpload" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleUpload(event)" style="display:none">
                <button class="upload-btn-sidebar" onclick="document.getElementById('excelUpload').click()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload Excel / CSV
                </button>
            </div>
        </div>

        <div class="sidebar-label" style="padding:0 18px 4px">Tables</div>
        <div id="navList"></div>

        <div class="sidebar-footer">
            <button class="export-btn" onclick="exportExcel()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export to Excel
            </button>
        </div>
    </aside>

    <!-- WORKSPACE -->
    <div id="workspace">
        <div class="empty-state" id="emptyState">
            <div class="big-icon">📂</div>
            <h2>No database loaded</h2>
            <p>Upload an Excel or CSV file to get started.</p>
            <button class="btn btn-accent" onclick="document.getElementById('excelUpload').click()">
                Upload File
            </button>
        </div>
    </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- MODAL -->
<div id="modal-backdrop">
    <div id="modal-box">
        <h3 id="modal-title">New Profile</h3>
        <p id="modal-desc">Enter a unique name for the new database profile.</p>
        <input id="modal-input" type="text" placeholder="profile_name">
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-accent" onclick="modalConfirm()">Create</button>
        </div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
let db = {};
let currentProfile = "default";
let activePage = "";
let sortState = {};   // { tableName: { col, dir } }
let filterState = {}; // { tableName: { col, value } }
const API = window.location.origin + "/api";

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
window.onload = async () => {
    loadTheme();
    await loadProfiles();
    await loadDatabase();
};

/* ═══════════════════════════════════════════════════════
   THEME
═══════════════════════════════════════════════════════ */
function loadTheme() {
    const t = localStorage.getItem('dp-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('dp-theme', next);
}

/* ═══════════════════════════════════════════════════════
   API HELPERS
═══════════════════════════════════════════════════════ */
async function apiFetch(url, opts = {}) {
    const res = await fetch(url, { headers: {'Content-Type':'application/json'}, ...opts });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

/* ═══════════════════════════════════════════════════════
   PROFILES
═══════════════════════════════════════════════════════ */
async function loadProfiles() {
    try {
        const data = await apiFetch(`${API}/profiles`);
        const sel = document.getElementById('profileSelector');
        sel.innerHTML = data.profiles.map(p =>
            `<option value="${p}" ${p===currentProfile?'selected':''}>${p}</option>`
        ).join('');
    } catch(e) { console.error(e); }
}

function switchProfile(name) {
    currentProfile = name;
    activePage = "";
    sortState = {};
    filterState = {};
    loadDatabase();
}

/* ═══════════════════════════════════════════════════════
   DATABASE
═══════════════════════════════════════════════════════ */
async function loadDatabase() {
    setStatus('loading');
    try {
        db = await apiFetch(`${API}/data?profile=${currentProfile}`);
        setStatus('online');
        buildUI();
    } catch(e) {
        setStatus('offline');
        showToast('Server offline', 'error');
    }
}

function setStatus(state) {
    const dot = document.getElementById('dotBullet');
    const label = document.getElementById('statusLabel');
    dot.className = 'dot ' + (state === 'online' ? 'online' : state === 'offline' ? 'offline' : '');
    label.textContent = state === 'online' ? currentProfile : state === 'offline' ? 'Offline' : 'Connecting';
}

/* ═══════════════════════════════════════════════════════
   BUILD UI
═══════════════════════════════════════════════════════ */
function buildUI() {
    const tables = Object.keys(db);
    const ws = document.getElementById('workspace');
    const nav = document.getElementById('navList');
    const empty = document.getElementById('emptyState');

    // Clear all pages (not emptyState)
    ws.querySelectorAll('.page').forEach(p => p.remove());
    nav.innerHTML = '';

    if (tables.length === 0) {
        empty.style.display = 'flex';
        return;
    }
    empty.style.display = 'none';

    if (!tables.includes(activePage)) activePage = tables[0];

    tables.forEach(name => {
        const rows = db[name] || [];
        const cols = getColumns(rows);

        // Nav item
        const navItem = document.createElement('div');
        navItem.className = `nav-item ${name === activePage ? 'active' : ''}`;
        navItem.id = `nav-${name}`;
        navItem.innerHTML = `
            <span class="nav-icon">⊞</span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
            <span class="nav-count">${rows.length}</span>
        `;
        navItem.onclick = () => switchPage(name);
        nav.appendChild(navItem);

        // Page
        const page = document.createElement('div');
        page.className = `page ${name === activePage ? 'active' : ''}`;
        page.id = `page-${name}`;
        page.innerHTML = buildPageHTML(name, rows, cols);
        ws.appendChild(page);

        // Bind search/filter inputs
        bindPageEvents(name);
    });
}

function getColumns(rows) {
    const s = new Set();
    rows.forEach(r => Object.keys(r).forEach(k => s.add(k)));
    return [...s];
}

function buildPageHTML(name, rows, cols) {
    const colOpts = cols.map(c => `<option value="${c}">${c}</option>`).join('');

    // Add row fields
    const addFields = cols.map(c => `
        <div class="add-row-field">
            <label>${c}</label>
            <input class="add-row-input" id="add_${name}_${col2id(c)}" placeholder="${c}…">
        </div>
    `).join('');

    return `
        <!-- Page Header -->
        <div class="page-header">
            <div class="page-title-group">
                <span class="page-title">${name}</span>
                <span class="page-badge" id="badge-${name}">${rows.length} records</span>
            </div>
            <div class="page-actions">
                <button class="btn btn-ghost" onclick="toggleAddPanel('${name}')">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Row
                </button>
            </div>
        </div>

        <!-- Add Row Panel -->
        <div class="add-row-panel" id="addpanel-${name}">
            <div class="add-row-grid">
                ${addFields}
                <div class="add-row-actions">
                    <button class="btn btn-accent" onclick="addRecord('${name}')">Save</button>
                    <button class="btn btn-ghost" onclick="toggleAddPanel('${name}')">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="search-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input class="table-search" id="search-${name}" placeholder="Search all columns…" oninput="applyFilters('${name}')">
            </div>
            <select class="col-filter" id="filtercol-${name}" onchange="applyFilters('${name}')">
                <option value="">All Columns</option>
                ${colOpts}
            </select>
            <select class="col-filter" id="filterval-${name}" onchange="applyFilters('${name}')">
                <option value="">All Values</option>
            </select>
            <span class="result-count" id="resultcount-${name}"></span>
            <button class="btn btn-ghost" style="padding:7px 10px;font-size:11px" id="clearbtn-${name}" onclick="clearFilters('${name}')" style="display:none">✕ Clear</button>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <table id="table-${name}">
                <thead><tr>${buildThead(name, cols)}<th class="no-sort" style="width:60px">⋯</th></tr></thead>
                <tbody id="tbody-${name}">${buildTbody(name, rows, cols, '', '', '')}</tbody>
            </table>
        </div>
    `;
}

function col2id(c) { return c.replace(/[^a-zA-Z0-9]/g,'_'); }

function buildThead(name, cols) {
    return cols.map(c => {
        const s = sortState[name];
        const cls = (s && s.col === c) ? (s.dir === 'asc' ? 'sort-asc' : 'sort-desc') : '';
        return `<th class="${cls}" onclick="sortTable('${name}','${c.replace(/'/g,"\\'")}')">
            ${c}
        </th>`;
    }).join('');
}

function buildTbody(name, rows, cols, searchTerm, filterCol, filterVal) {
    // 1. Filter
    let filtered = rows.filter((row, idx) => {
        row._origIdx = idx;
        // column-value filter
        if (filterCol && filterVal) {
            const cell = String(row[filterCol] ?? '').toLowerCase();
            if (!cell.includes(filterVal.toLowerCase())) return false;
        }
        // text search
        if (searchTerm) {
            const haystack = filterCol
                ? String(row[filterCol] ?? '').toLowerCase()
                : Object.values(row).join(' ').toLowerCase();
            if (!haystack.includes(searchTerm.toLowerCase())) return false;
        }
        return true;
    });

    // 2. Sort
    const s = sortState[name];
    if (s) {
        filtered.sort((a,b) => {
            let av = a[s.col] ?? '', bv = b[s.col] ?? '';
            // numeric?
            if (!isNaN(av) && !isNaN(bv)) { av = +av; bv = +bv; }
            else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
            return s.dir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
        });
    }

    if (filtered.length === 0) {
        const span = cols.length + 1;
        return `<tr><td colspan="${span}" class="no-results">
            <div style="font-size:32px;opacity:.3">🔍</div>
            <p>No records match your filters.</p>
        </td></tr>`;
    }

    return filtered.map(row => {
        const idx = row._origIdx ?? rows.indexOf(row);
        const tds = cols.map(c => {
            let val = row[c] ?? '';
            let display = escHtml(String(val));
            if (searchTerm) display = highlight(display, searchTerm);
            return `<td class="interactive-cell" data-table="${name}" data-idx="${idx}" data-col="${escAttr(c)}" data-val="${escAttr(String(val))}" onclick="startEdit(this)">
                <span class="cell-val">${display || '<span style="color:var(--text-muted);font-style:italic">—</span>'}</span>
            </td>`;
        }).join('');
        return `<tr data-row-idx="${idx}">
            ${tds}
            <td><div class="row-actions">
                <button class="row-del-btn" onclick="deleteRow('${name}',${idx})" title="Delete row">🗑</button>
            </div></td>
        </tr>`;
    }).join('');
}

function highlight(html, term) {
    if (!term) return html;
    const re = new RegExp(`(${escRegex(term)})`, 'gi');
    return html.replace(re, '<mark>$1</mark>');
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return s.replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ═══════════════════════════════════════════════════════
   EVENTS BINDING
═══════════════════════════════════════════════════════ */
function bindPageEvents(name) {
    // Populate filterval when filtercol changes
    const fcol = document.getElementById(`filtercol-${name}`);
    const fval = document.getElementById(`filterval-${name}`);
    fcol.addEventListener('change', () => {
        const col = fcol.value;
        fval.innerHTML = '<option value="">All Values</option>';
        if (col && db[name]) {
            const uniq = [...new Set(db[name].map(r => String(r[col] ?? '')).filter(Boolean))].sort();
            uniq.forEach(v => {
                fval.innerHTML += `<option value="${escAttr(v)}">${escHtml(v)}</option>`;
            });
        }
        applyFilters(name);
    });
}

/* ═══════════════════════════════════════════════════════
   SWITCH PAGE
═══════════════════════════════════════════════════════ */
function switchPage(name) {
    activePage = name;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const pg = document.getElementById(`page-${name}`);
    const nv = document.getElementById(`nav-${name}`);
    if (pg) pg.classList.add('active');
    if (nv) nv.classList.add('active');
}

/* ═══════════════════════════════════════════════════════
   SORT
═══════════════════════════════════════════════════════ */
function sortTable(name, col) {
    const cur = sortState[name];
    if (cur && cur.col === col) {
        sortState[name].dir = cur.dir === 'asc' ? 'desc' : 'asc';
    } else {
        sortState[name] = { col, dir: 'asc' };
    }
    rerenderTable(name);
}

/* ═══════════════════════════════════════════════════════
   FILTER
═══════════════════════════════════════════════════════ */
function applyFilters(name) {
    rerenderTable(name);
    // show/hide clear button
    const search = document.getElementById(`search-${name}`).value;
    const col = document.getElementById(`filtercol-${name}`).value;
    const val = document.getElementById(`filterval-${name}`).value;
    const btn = document.getElementById(`clearbtn-${name}`);
    btn.style.display = (search || col || val) ? 'inline-flex' : 'none';
}

function clearFilters(name) {
    document.getElementById(`search-${name}`).value = '';
    document.getElementById(`filtercol-${name}`).value = '';
    document.getElementById(`filterval-${name}`).innerHTML = '<option value="">All Values</option>';
    applyFilters(name);
}

function rerenderTable(name) {
    const rows = db[name] || [];
    const cols = getColumns(rows);
    const search = document.getElementById(`search-${name}`)?.value || '';
    const filterCol = document.getElementById(`filtercol-${name}`)?.value || '';
    const filterVal = document.getElementById(`filterval-${name}`)?.value || '';

    // Regen thead (for sort indicators)
    const thead = document.querySelector(`#table-${name} thead tr`);
    if (thead) thead.innerHTML = buildThead(name, cols) + `<th class="no-sort" style="width:60px">⋯</th>`;

    // Regen tbody
    const tbody = document.getElementById(`tbody-${name}`);
    if (tbody) tbody.innerHTML = buildTbody(name, rows, cols, search, filterCol, filterVal);

    // Update badge
    const visible = tbody.querySelectorAll('tr[data-row-idx]').length;
    const badge = document.getElementById(`badge-${name}`);
    const count = document.getElementById(`resultcount-${name}`);
    if (badge) badge.textContent = `${rows.length} records`;
    if (count) count.textContent = visible < rows.length ? `${visible} of ${rows.length} shown` : '';
}

/* ═══════════════════════════════════════════════════════
   ADD ROW
═══════════════════════════════════════════════════════ */
function toggleAddPanel(name) {
    const p = document.getElementById(`addpanel-${name}`);
    p.classList.toggle('open');
}

function addRecord(name) {
    const cols = getColumns(db[name] || []);
    let rowData = {};
    let hasData = false;
    cols.forEach(c => {
        const el = document.getElementById(`add_${name}_${col2id(c)}`);
        const v = el ? el.value.trim() : '';
        rowData[c] = v;
        if (v) hasData = true;
    });
    if (!hasData) return showToast('Please fill at least one field.', 'warn');

    db[name].unshift(rowData);
    // clear inputs
    cols.forEach(c => {
        const el = document.getElementById(`add_${name}_${col2id(c)}`);
        if (el) el.value = '';
    });
    // update nav count
    const nc = document.querySelector(`#nav-${name} .nav-count`);
    if (nc) nc.textContent = db[name].length;
    rerenderTable(name);
    showToast('Row added', 'success');

    apiFetch(`${API}/add-row`, {
        method: 'POST',
        body: JSON.stringify({ profile: currentProfile, table: name, rowData })
    }).catch(() => showToast('Sync failed', 'error'));
}

/* ═══════════════════════════════════════════════════════
   INLINE EDIT
═══════════════════════════════════════════════════════ */
function startEdit(td) {
    if (td.querySelector('input,select')) return;
    const { table, idx, col, val } = td.dataset;
    const name = table, index = +idx, field = col, currentVal = val;

    // Build unique values for dropdown
    const uniq = [...new Set((db[name]||[]).map(r => String(r[field]??'')).filter(Boolean))].sort();
    const opts = uniq.map(v =>
        `<option value="${escAttr(v)}" ${v===currentVal?'selected':''}>${escHtml(v)}</option>`
    ).join('');

    td.innerHTML = `<select class="inline-select">
        ${opts}
        <option value="__custom__">✏️ Custom value…</option>
    </select>`;
    const sel = td.querySelector('select');
    sel.focus();
    sel.addEventListener('change', () => {
        if (sel.value === '__custom__') {
            td.innerHTML = `<input class="inline-input" value="${escAttr(currentVal)}">`;
            const inp = td.querySelector('input');
            inp.focus(); inp.select();
            inp.addEventListener('blur', () => commitEdit(name, index, field, inp.value, currentVal, td));
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { rerenderTable(name); } });
        } else {
            commitEdit(name, index, field, sel.value, currentVal, td);
        }
    });
    sel.addEventListener('blur', () => {
        setTimeout(() => { if (td.querySelector('select')) rerenderTable(name); }, 150);
    });
    sel.addEventListener('click', e => e.stopPropagation());
}

function commitEdit(name, index, field, newVal, oldVal, td) {
    newVal = newVal.trim();
    if (newVal === oldVal || newVal === '') { rerenderTable(name); return; }
    db[name][index][field] = newVal;
    rerenderTable(name);
    showToast('Saved', 'success');
    apiFetch(`${API}/update-cell`, {
        method: 'POST',
        body: JSON.stringify({ profile: currentProfile, table: name, index, field, value: newVal })
    }).catch(() => showToast('Sync failed', 'error'));
}

/* ═══════════════════════════════════════════════════════
   DELETE ROW
═══════════════════════════════════════════════════════ */
function deleteRow(name, index) {
    showConfirmModal(
        `Delete row?`,
        `This will permanently remove row ${index + 1} from <strong>${name}</strong>.`,
        () => {
            db[name].splice(index, 1);
            const nc = document.querySelector(`#nav-${name} .nav-count`);
            if (nc) nc.textContent = db[name].length;
            rerenderTable(name);
            showToast('Row deleted', 'success');
            apiFetch(`${API}/delete-row`, {
                method: 'POST',
                body: JSON.stringify({ profile: currentProfile, table: name, index })
            }).catch(() => showToast('Sync failed', 'error'));
        }
    );
}

/* ═══════════════════════════════════════════════════════
   GLOBAL SEARCH
═══════════════════════════════════════════════════════ */
function globalSearchHandler(term) {
    if (!term) return;
    // Switch to first table that has a match, fill its search
    const tables = Object.keys(db);
    for (const name of tables) {
        const rows = db[name] || [];
        const hit = rows.some(r => Object.values(r).join(' ').toLowerCase().includes(term.toLowerCase()));
        if (hit) {
            switchPage(name);
            const si = document.getElementById(`search-${name}`);
            if (si) { si.value = term; applyFilters(name); }
            break;
        }
    }
}

/* ═══════════════════════════════════════════════════════
   EXCEL UPLOAD
═══════════════════════════════════════════════════════ */
async function handleUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    showConfirmModal(
        `Upload & Replace?`,
        `This will overwrite the current profile <strong>${currentProfile}</strong> with the contents of <strong>${file.name}</strong>.`,
        async () => {
            showToast('Parsing file…', 'warn');
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    let newDb = {};
                    wb.SheetNames.forEach(s => {
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[s], { defval: '' });
                        if (rows.length > 0) newDb[s] = rows;
                    });
                    await apiFetch(`${API}/upload-db`, {
                        method: 'POST',
                        body: JSON.stringify({ profile: currentProfile, dbData: newDb })
                    });
                    event.target.value = '';
                    activePage = '';
                    await loadDatabase();
                    showToast('Import successful!', 'success');
                } catch(err) {
                    showToast('Parse error: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        },
        () => { event.target.value = ''; }
    );
}

/* ═══════════════════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════════════════ */
function exportExcel() {
    if (!Object.keys(db).length) return showToast('Database is empty', 'warn');
    const wb = XLSX.utils.book_new();
    Object.keys(db).forEach(t => {
        if (db[t].length > 0) {
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db[t]), t.substring(0,31));
        }
    });
    XLSX.writeFile(wb, `Export_${currentProfile}_${Date.now()}.xlsx`);
    showToast('Export complete', 'success');
}

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function showToast(msg, type = 'success') {
    const icons = { success: '✓', error: '✕', warn: '⚠' };
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${icons[type]||'•'}</span><span>${msg}</span>`;
    c.appendChild(t);
    setTimeout(() => {
        t.style.animation = 'slideOut 0.25s ease forwards';
        setTimeout(() => t.remove(), 260);
    }, 2800);
}

/* ═══════════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════════ */
let _modalConfirmCb = null, _modalCancelCb = null;

function createProfileModal() {
    document.getElementById('modal-title').textContent = 'New Profile';
    document.getElementById('modal-desc').textContent = 'Enter a unique name for the new database profile.';
    document.getElementById('modal-input').style.display = 'block';
    document.getElementById('modal-input').value = '';
    document.querySelector('#modal-box .modal-actions').innerHTML = `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-accent" onclick="modalConfirm()">Create</button>
    `;
    _modalConfirmCb = () => {
        const raw = document.getElementById('modal-input').value.trim();
        const name = raw.replace(/[^a-zA-Z0-9_\-]/g,'');
        if (!name) return showToast('Invalid name', 'error');
        currentProfile = name;
        closeModal();
        loadDatabase().then(() => loadProfiles());
    };
    openModal();
}

function showConfirmModal(title, descHTML, onConfirm, onCancel) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').innerHTML = descHTML;
    document.getElementById('modal-input').style.display = 'none';
    document.querySelector('#modal-box .modal-actions').innerHTML = `
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" onclick="modalConfirm()">Confirm</button>
    `;
    _modalConfirmCb = onConfirm;
    _modalCancelCb = onCancel;
    openModal();
}

function openModal() {
    document.getElementById('modal-backdrop').classList.add('open');
    const inp = document.getElementById('modal-input');
    if (inp.style.display !== 'none') inp.focus();
}
function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    if (_modalCancelCb) { _modalCancelCb(); _modalCancelCb = null; }
}
function modalConfirm() {
    document.getElementById('modal-backdrop').classList.remove('open');
    if (_modalConfirmCb) { _modalConfirmCb(); _modalConfirmCb = null; }
}

// Close modal on backdrop click
document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
});
// Enter key in modal input
document.getElementById('modal-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') modalConfirm();
});
</script>
</body>
</html>
